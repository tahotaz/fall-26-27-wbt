<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form method="post">


        <table>
            <tr>
                <td>
                    <label for="firstname">First Name*:</label>
                </td>
                <td><input type="text" id="firstname" name="firstname" required></td>
            </tr>

            <tr>
                <td>
                    <label for="lastname">Last Name*:</label>
                </td>
                <td><input type="text" id="lastname" name="lastname" required></td>
            </tr>

            <tr>
                <td>
                    <label for="company">Company: </label>
                </td>
                <td><input type="text" id="company" name="company" required</td>
            </tr>

            <tr>
                <td>
                    <label for="address1">Address 1*: </label>
                </td>
                <td><input type="text" id="address1" name="address1" required</td>
            </tr>

            <tr>
                <td>
                    <label for="address2">Address 2*: </label>
                </td>
                <td><input type="text" id="address2" name="address2" required</td>
            </tr>

            <tr>
                <td>
                    <label for="city">City: </label>
                </td>
                <td><input type="text" id="city" name="city" required</td>
            </tr>

            <tr>
                <td>
                    <label for="state">State: </label>
                    <select name="state" id="state" name="state" required>
                        <option value="Select a state">Select a state</option>
                        <option value="Dhaka">Dhaka</option>
                        <option value="Chittagong">Chittagong</option>
                        <option value="Rangpur">Rangpur</option>
                        <option value="Sylhet">Sylhet</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="zip">Zip Code*: </label>
                </td>
                <td><input type="number" id="zip" name="zip" required</td>
            </tr>

            <tr>
                <td>
                    <label for="country">Country*: </label>
                    <select name="state" id="country" name="country" required>
                        <option value="Select a country">Select a country</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="Finland">Finland</option>
                        <option value="USA">USA</option>
                        <option value="Nepal">Nepal</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="phone">Phone*: </label>
                </td>
                <td><input type="tel" id="tel" name="tel" required</td>
            </tr>

            <tr>
                <td>
                    <label for="Fax">Fax*: </label>
                </td>
                <td><input type="tel" id="fax" name="fax" required</td>
            </tr>

            <tr>
                <td>
                    <label for="email">Email*: </label>
                </td>
                <td><input type="email" id="email" name="email" required</td>
            </tr>

            <tr>
                <td>
                    <label for="amount">Donation Amount*: </label>
                    <br>check a button or type your amount
                </td>
                <td>
                    <input type="radio" name="amount" value="none">none
                    <input type="radio" name="amount" value="$50">$50
                    <input type="radio" name="amount" value="$75">$75
                    <input type="radio" name="amount" value="$100">$100
                    <input type="radio" name="amount" value="$250">$250
                    <input type="radio" name="amount" value="others">Others
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <label for="otheramount"> $Other amount* :</label>
                    <input type="number" id="otheramount" name="otheramount" required</td>
            </tr>

            <tr>
                <td>
                    <label for="recurramount"> Recurring Amount* :</label< /td>
                        <br>(check if yes)
                <td>
                    <input type="checkbox" value="I am interested in giving regular amount">I am interested in
                    giving regular amount

                </td>
            </tr>

            <tr>
                <td><label for="monthly">Monthly Credit Card $</label></td>
                <td>
                    <input type="number" id="monthly" name="monthly">For <input type="number" id="months"
                        name="months">Months
                </td>
            </tr>

        </table>
        <input type="submit" value="continue">
        <input type="reset">
    </form>
</body>

</html>
