<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>
    <h1>Contact Me</h1>

    <form>
        <label>First Name</label><br>
        <input type="text"><br><br>

        <label>Last Name</label><br>
        <input type="text"><br><br>

        <label>Email</label><br>
        <input type="email"><br><br>

        <label>Country:</label><br>
        <select>
            <option>Bangladesh</option>
            <option>Other</option>
            <option>UK</option>
            <option>USA</option>
        </select><br><br>

        <label>Reason of Contact:</label><br>
        <input type="radio" name="reason"> Job<br>
        <input type="radio" name="reason"> Project<br>
        <input type="radio" name="reason"> Research<br><br>

        <label>Domain:</label><br>
        <input type="checkbox"> Web Development<br>
        <input type="checkbox"> AI/ML Development<br>
        <input type="checkbox"> Mobile Development<br><br>

        <label>Message</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <label>Appointment Date</label><br>
        <input type="date"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <a href="index.html">Back to Home</a>

</body>

</html>
